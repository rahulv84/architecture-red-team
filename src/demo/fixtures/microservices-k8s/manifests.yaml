apiVersion: v1
kind: Namespace
metadata:
  name: payflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-endpoints
  namespace: payflow
data:
  ORDERS_URL: "http://orders-service:8080"
  PAYMENTS_URL: "http://payments-service:8080"
  INVENTORY_URL: "http://inventory-service:8080"
  DB_HOST: "postgres"
  CACHE_HOST: "redis"
  KAFKA_BOOTSTRAP: "kafka:9092"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: payflow
type: Opaque
stringData:
  username: payflow
  password: "Pf-Pr0d-2025!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: kong
          image: kong:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: service-endpoints
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders
          image: registry.example.com/payflow/orders:1.8.2
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-endpoints
          env:
            - name: DB_PASSWORD
              value: "Pf-Pr0d-2025!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: payflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
    spec:
      hostNetwork: true
      containers:
        - name: payments
          image: registry.example.com/payflow/payments:2.1.0
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: service-endpoints
          env:
            - name: ACQUIRER_API_KEY
              value: "live-acq-7f3c91d2aa"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: payflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory
          image: registry.example.com/payflow/inventory
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          envFrom:
            - configMapRef:
                name: service-endpoints
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: payflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notifier
          image: registry.example.com/payflow/notifier:0.9.4
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          envFrom:
            - configMapRef:
                name: service-endpoints
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: payflow
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: payflow
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: payflow
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.6
          ports:
            - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: payflow
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: payflow
spec:
  selector:
    app: orders-service
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-service
  namespace: payflow
spec:
  selector:
    app: payments-service
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: payflow
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: payflow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: payflow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: payflow
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-api
  namespace: payflow
spec:
  rules:
    - host: api.payflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /reports
            pathType: Prefix
            backend:
              service:
                name: reporting-service
                port:
                  number: 8080
