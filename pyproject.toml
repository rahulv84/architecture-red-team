[project]
name = "architecture-red-team"
version = "1.0.0"
description = "Adversarial architecture review with six specialist AI critics, a moderator and human-in-the-loop workflow (local POC)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pydantic>=2.6", "pydantic-settings>=2.2",
  "python-dotenv>=1.0", "sqlalchemy>=2.0", "langgraph>=0.2.60", "langgraph-checkpoint-sqlite>=2.0",
  "streamlit>=1.37", "httpx>=0.27", "pypdf>=4.0", "python-docx>=1.1", "python-pptx>=0.6.23", "pyyaml>=6.0",
  "defusedxml>=0.7", "pillow>=10.0", "python-hcl2>=4.3", "reportlab>=4.0", "anthropic>=0.40", "openai>=1.40", "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not live'"
markers = [
  "live: tests that call a real LLM provider (require API keys; deselected by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", "data", "dist"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM108", "E501", "B905", "SIM102", "SIM103", "UP042", "B904", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
